name: parcel-watcher-android-spike

# TEST ONLY. Phase 3 spike (file watching) of the OpenCode v2 migration: builds the Bionic
# arm64 binding for @parcel/watcher. Output is an artifact, not a commit. Runs
# only when this spike or this workflow changes, so it does not touch the release gates.
on:
  push:
    branches: [arena/01a0b9d5-opencode-app]
    paths:
      - 'spike/parcel-watcher-android/**'
      - '.github/workflows/parcel-watcher-android-spike.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PARCEL_OUT: /tmp/parcel-watcher-android-out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22 (runs node-gyp; the addon targets Node 26 headers)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same pinned NDK as the Node 26 spike, so the two Android builds match.
      - name: Install pinned NDK 28.2.13676358
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error title=parcel-watcher-android::sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if ! "$SDKMANAGER" --install "ndk;28.2.13676358" > "$RUNNER_TEMP/ndk-install.log" 2>&1; then
            tail -n 40 "$RUNNER_TEMP/ndk-install.log"
            echo "::error title=parcel-watcher-android::NDK 28.2.13676358 install failed"
            exit 1
          fi
          ls "$ANDROID_HOME/ndk"

      - name: Build @parcel/watcher for Android arm64 and run the ELF checks
        run: bash spike/parcel-watcher-android/build-parcel-watcher-android.sh
        shell: bash

      - name: Upload the Bionic binding and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcel-watcher-android-arm64
          path: |
            /tmp/parcel-watcher-android-out/report.txt
            /tmp/parcel-watcher-android-out/watcher.node
            /tmp/parcel-watcher-android-out/work/gyp-build.log
          retention-days: 14
          if-no-files-found: warn
