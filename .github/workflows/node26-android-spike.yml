name: node26-android-spike

# Manual only. Builds Node 26 as an Android/Bionic arm64 executable for the
# spike in spike/node26/. The output is an artifact, not a commit, so it does not
# add to the repository. The shipping Node 24 pin is not changed.
on:
  push:
    branches: [arena/01a0b9d5-opencode-app]
    paths:
      - 'spike/node26/**'
      - '.github/workflows/node26-android-spike.yml'
  workflow_dispatch:

jobs:
  build:
    # Two ICU modes in parallel: full-icu (the shipped default) and small-icu (root + en).
    # Each job uploads its own report, so the size difference can be read from both.
    strategy:
      fail-fast: false
      matrix:
        icu: [full-icu, small-icu]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NODE26_OUT: /tmp/node26-out
      NODE26_ICU: ${{ matrix.icu }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image does not ship the pinned NDK 28.2.13676358 (it has 27.3 and
      # 30.0). The Node 24 recipe falls back to another NDK and logs drift; this spike
      # installs the pinned NDK instead, so the build script can stay strict.
      - name: Install pinned NDK 28.2.13676358
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error title=node26-spike::sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if ! "$SDKMANAGER" --install "ndk;28.2.13676358" > "$RUNNER_TEMP/ndk-install.log" 2>&1; then
            tail -n 40 "$RUNNER_TEMP/ndk-install.log"
            echo "::error title=node26-spike::NDK 28.2.13676358 install failed"
            exit 1
          fi
          ls "$ANDROID_HOME/ndk"

      - name: Build Node 26 for Android (arm64, ${{ matrix.icu }})
        run: bash spike/node26/build-node26-android.sh
        shell: bash

      - name: Upload binary and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node26-android-arm64-${{ matrix.icu }}
          path: |
            /tmp/node26-out/report.txt
            /tmp/node26-out/node-ninja.log
            /tmp/node26-out/node26-arm64/bin/node
          retention-days: 14
          if-no-files-found: warn
