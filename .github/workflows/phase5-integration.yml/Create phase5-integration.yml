# PHASE 5 - OPENCODE CLIENT INTEGRATION gates (app as a real client of the
# on-device OpenCode server: loopback binding, events/streaming, permissions,
# MCP transports, Keystore-held credentials).
#
# HOW TO INSTALL (one-time): copy this file to
#   .github/workflows/phase5-integration.yml
# on the arena/01a05713-opencode-app branch and push. The session bot token
# cannot create or modify files under .github/workflows/ (verified in Phases 2-4),
# so this copy has to be made with a user credential or the GitHub UI "Add file".
#
# Two supported ways to get a Phase 5 run:
#   1. this workflow (standalone): builds payload + APKs, boots its own emulator,
#      installs the app AND the androidTest APK, then runs phase5's gates.
#   2. the Phase 4 tail stage: .github/workflows/phase4-runtime-host.yml already
#      runs phase4/scripts/00-run-phase4.sh, which now ends by calling
#      phase5/scripts/00-run-phase5.sh --stage-after-phase4 on the SAME emulator
#      (faster, and it means a green phase4 job also covers phase 5).
#
# No repo secret is required: the pinned build resolves a key-free default model
# (opencode/big-pickle). OPENROUTER_API_KEY is read only if it exists, exactly as
# in phase 4, to enable the optional live-model halves of the phase-4 drivers.
name: phase5-integration

on:
  push:
    branches:
      - "arena/01a05713-opencode-app"
    paths-ignore:
      - "docs/progress/phase5-evidence/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run is being dispatched (free text)"
        required: false
        default: "manual phase5 gate run"

jobs:
  phase5-client-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Fix /dev/kvm permissions (Phase 2/3 lesson: never assume KVM just works)"
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -la /dev/kvm
          else
            echo "KVM_MISSING (the emulator will be unusable; gates fail loudly)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Run the Phase 5 suite (payload + APKs -> emulator -> client gates)"
        run: bash phase5/scripts/00-run-phase5.sh
        shell: bash

      - name: "Commit evidence to the branch (docs/progress/phase5-evidence)"
        if: always()
        run: |
          # The orchestrator already copies + pushes; this step is the fallback in
          # case it stopped before reaching its own evidence stage.
          mkdir -p docs/progress/phase5-evidence
          if [ -d phase5/out/evidence ]; then
            cp -r phase5/out/evidence/. docs/progress/phase5-evidence/ 2>/dev/null || true
          fi
          cp phase5/out/00-run-phase5.log docs/progress/phase5-evidence/ 2>/dev/null || true
          git add -A docs/progress/phase5-evidence/ || true
          if git diff --cached --quiet; then
            echo "no evidence changes; skipping commit"
          else
            git -c user.name="arena-ai-coding-agent[bot]" \
                -c user.email="arena-ai-coding-agent[bot]@users.noreply.github.com" \
                commit -m "phase5: client-integration evidence (auto)" || true
            git push origin "HEAD:${{ github.ref_name }}" || echo "PUSH_FAILED"
          fi

      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-integration
          path: |
            phase5/out/evidence/
            phase5/out/00-run-phase5.log
            docs/progress/phase5-evidence/
            app/build/outputs/apk/
          if-no-files-found: ignore

      - name: "Gate summary (readable in the Actions log)"
        if: always()
        run: |
          if [ -f phase5/out/evidence/GATES_SUMMARY.txt ]; then
            cat phase5/out/evidence/GATES_SUMMARY.txt
          else
            echo "NO_PHASE5_SUMMARY - the suite did not reach its gate stage"
            exit 1
          fi
