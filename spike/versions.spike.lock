# versions.spike.lock — pinned versions for the Phase 2 spike environment (2026-08-27)
# See versions.lock at the repo root for the product-level pins. This file pins the
# throwaway spike environment used to generate Phase 2 evidence.

spike:
  emulator: google emulator (from Android SDK cmdline-tools, dl.google.com)
  system_image: "system-images;android-34;google_apis;x86_64"   # Android 14, API 34
  avd: spike (device profile pixel_5)
  runner: ubuntu-latest (GitHub Actions, KVM)

runtime:
  # Bun for Android (bionic x86_64) — official npm platform package, same version
  # as the OpenCode repo's packageManager pin (bun 1.3.14).
  bun_android: "@oven/bun-linux-x64-android@1.3.14"
  bun_android_tarball_sha256: (computed at fetch time on the runner; see log)
  host_bun_for_build: "@oven/bun-linux-x64@1.3.14"   # used on the runner to build the bundle

opencode:
  upstream: https://github.com/anomalyco/opencode
  branch: dev
  commit: 05ea5073be967c779d326929b2de6228dda4159d    # per versions.lock
  version: 1.18.23
  bundle_entry: packages/opencode/src/node.ts
  bundle_target: bun          # adaptation of upstream build-node.ts (target: node);
                              # bun 1.3.14 lacks node:sqlite, so the #db bun condition
                              # (db.bun.ts -> bun:sqlite) is used instead
  models_data: fetched from https://models.dev/api.json at build time (upstream generate.ts)

userspace_tools:
  shell: /system/bin/sh (mksh, part of the Android system image)
  git: built statically on the runner (musl-gcc or gcc -static, NO_OPENSSL/NO_CURL/...)
  ripgrep: 15.1.0 x86_64-unknown-linux-musl from BurntSushi GitHub release
  # (ripgrep's upstream default for arm64-linux is aarch64-unknown-linux-gnu per
  #  packages/core/src/ripgrep/binary.ts; the spike uses the musl build on x86_64)

stubbed_native_addons (documented degradation, Core Rule 6):
  - "@lydell/node-pty@1.2.0-beta.12"   # no Android build; stub throws at use-time
  - "bun-pty@0.4.8"                    # no Android build; stub throws at use-time
  - "@parcel/watcher@2.5.1"            # no Android binding; upstream's own graceful
                                       # fallback (watcher disabled) is exercised

server_env:
  OPENCODE_SERVER_USERNAME: opencode
  OPENCODE_SERVER_PASSWORD: spike-password (throwaway)
  OPENCODE_CLIENT: android-spike
  XDG_DATA_HOME / XDG_CONFIG_HOME / XDG_STATE_HOME / XDG_CACHE_HOME / TMPDIR / HOME:
    /data/local/tmp/spike/{data,config,state,cache,tmp,home}
