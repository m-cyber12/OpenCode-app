# versions.lock — pinned component versions (DRAFT, Phase 1)
#
# Populated from static inspection of upstream OpenCode at
# commit 05ea5073be967c779d326929b2de6228dda4159d. All entries are NOT TESTED
# on Android until Phase 2/3 proves them. Regenerate/update whenever the
# pinned OpenCode version changes (Core Rule 7).
#
# NOTE (2026-08-27, Phase 1 correction): upstream org renamed SST -> Anomaly.
# The canonical repo is now github.com/anomalyco/opencode; github.com/sst/opencode
# 301-redirects to it (same repository id 975734319 — a rename, not a fork).
# The default branch is `dev` (there is no `main`/`master`). The pinned commit
# 05ea5073... is unchanged and is still HEAD of `dev` at package version 1.18.23.

opencode:
  upstream: https://github.com/anomalyco/opencode
  commit: 05ea5073be967c779d326929b2de6228dda4159d   # HEAD of `dev` (default branch)
  version: 1.18.23                                    # packages/*/package.json
  # NOTE (2026-08-28, Phase 2): the first spike run (evidence commit d161ccd) built the
  # bundle from `dev` HEAD 755ebdb94ee7 (v1.18.25, "sync release versions for v1.18.25"),
  # because the artifact script cloned dev without checking out the pinned commit.
  # That was a real upstream release, one minor newer than the pin — the chain result
  # is valid evidence, but it is NOT the pinned commit. The script is now fixed to
  # checkout $PINNED_COMMIT; re-run to re-produce evidence at the exact pin.

runtime:
  # PHASE 2 UPDATE (2026-08-27, spike evidence): the embedded Android host runtime
  # is Bun-for-Android (official @oven/bun-linux-x64-android / -aarch64-android npm
  # packages; bionic-linked, interp /system/bin/linker64), pinned to the same 1.3.14
  # as the repo's packageManager. Bun 1.3.14 does NOT implement node:sqlite, so the
  # server bundle is built with Bun.build target "bun" to resolve upstream's own
  # "#db" bun condition (packages/opencode/src/storage/db.bun.ts -> bun:sqlite).
  # The upstream Node path (desktop sidecar precedent) stays valid for Phase 3 if a
  # Node-for-Android runtime becomes available; the spike chose the available,
  # pinned runtime. Evidence: docs/progress/phase2-*.
  bun_android_x64: 1.3.14        # @oven/bun-linux-x64-android (spike-tested x86_64)
  bun_android_arm64: 1.3.14      # @oven/bun-linux-aarch64-android (product target arm64-v8a)
  host_bun_for_build: 1.3.14     # @oven/bun-linux-x64 (build host)
  node: ">=22.5.0"               # node:sqlite requirement; NOT the Android runtime in the spike
  node_toolchain_types: 24.12.2
  # CLI-only runtime (NOT required for the Android server path)
  bun: 1.3.14           # root package.json "packageManager"
  bun_types: 1.3.13

native_components:
  - name: "@lydell/node-pty"          # PTY addon (N-API)
    version: 1.2.0-beta.12
    note: "NO Android build; stub. PHASE 3 VERIFIED: the bash tool (tool/bash.ts) spawns the configured shell with stdio pipes (no PTY); PTY is only used by the lazy Pty service for the interactive terminal feature — documented degradation only"
  - name: bun-pty                     # bun-native PTY addon
    version: 0.4.8
    note: "NO Android build; stub (same conclusion as @lydell/node-pty, Phase 3)"
  - name: "@parcel/watcher"           # file-watcher addon (optional; graceful fallback)
    version: 2.5.1
    note: "no Android binding; upstream's graceful fallback (watcher disabled) exercised in spike"
  - name: ripgrep                     # downloaded ELF at runtime (packages/core/src/ripgrep/binary.ts)
    version: 15.1.0
    note: "real upstream source built for x86_64-linux-android and aarch64-linux-android with Cargo + NDK/Bionic; avoids static desktop binaries that SIGSYS under Android's zygote policy"
  - name: git                         # external, resolved at runtime; bundled Android executable
    version: v2.48.1                  # real Git source built with the Android NDK/Bionic toolchain
    note: "Phase 2 NO_PERL blocker fixed: build the Makefile directly with NO_PERL=YesPlease. HTTPS/curl disabled — local repo ops only (init/status/add/commit/diff/branches/log). Bionic-linked rather than static-musl because Android's app seccomp policy cannot be repaired after a static exec."
  - name: posix-shell                 # sh/bash/zsh/dash/ksh; must be bundled (static)
    version: android-system           # Android's own /system/bin/sh (mksh, MIRBSD KSH R59) — real shell, TESTED
    note: "config shell: /system/bin/sh (Shell.preferred honors config 'shell')"

bun_only_components:                  # NOT needed for the embedded server
  - name: "@ff-labs/fff-bun"          # native file search; ripgrep fallback exists
    version: 0.9.4
  - name: bun-pty
    version: 0.4.8
  - name: "@opentui/core"             # TUI renderer (platform binaries)
    version: 0.4.5

wasm_components:                      # portable; ship assets with the server bundle
  - name: "@silvia-odwyer/photon-node"   # image processing
    version: 0.3.4
  - name: web-tree-sitter
    version: 0.25.10
  - name: tree-sitter-bash
    version: 0.25.0
  - name: tree-sitter-powershell
    version: 0.25.10

key_js_dependencies:
  - name: "@modelcontextprotocol/sdk"   # MCP stdio/HTTP/SSE
    version: 1.29.0
    # PHASE 5: the same pin is used by the host-side REMOTE MCP fixture
    # (phase5/mcp/remote-mcp-server.mjs: StreamableHTTPServerTransport +
    # SSEServerTransport) that gate P5-G16 points the on-device OpenCode client
    # at. Reused from phase4/out/mcp/node_modules when present so both fixtures
    # are provably the same version; no fixture code ships in the APK.
    note: "PHASE 3: used as the REAL MCP stdio server+client on-device (G10). npm deps: zod ^3.25||^4, zod-to-json-schema, hono, express, eventsource, jose, ajv, cors, cross-spawn, pkce-challenge, raw-body, content-type"
  - name: effect                        # core framework
    version: 4.0.0-beta.83
  - name: hono                          # HTTP API
    version: 4.10.7
  - name: ws                            # WebSocket event stream
    version: 8.21.0
  - name: cross-spawn                   # child-process spawning
    version: 7.0.6
  - name: which                         # PATH lookup
    version: 6.0.1
  - name: xdg-basedir                   # XDG path resolution
    version: 5.1.0
  - name: drizzle-orm
    version: 1.0.0-rc.2
  - name: bonjour-service               # mDNS (serve/share; degrades silently)
    version: 1.3.0

model:
  # PHASE 3 (2026-08-29): OpenRouter is a built-in provider
  # (packages/llm/src/providers/openrouter.ts; auth via OPENROUTER_API_KEY env).
  # G15/G12 run the real agent loop against it. Key comes from the GitHub secret
  # OPENROUTER_API_KEY (never committed); model id overridable via OPENROUTER_MODEL.
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: nvidia/nemotron-3-ultra-550b-a55b:free

abi_scope:
  priority: arm64-v8a
  emulator_only: x86_64
  unsupported: [armeabi-v7a, x86]       # dropped by modern V8/Node & Bun

# ============================================================================
# PHASE 4 (2026-08-29) — EMBEDDED RUNTIME HOST packaging/layout
# The app (app/ module, Kotlin/Compose, applicationId ai.opencode.android)
# ships EVERYTHING in one APK; the user never downloads or installs anything.
# Executables are packaged as JNI libs (lib<name>.so per ABI) so Android
# extracts them to the exec-allowed nativeLibraryDir (W^X, API 29+); the JS
# payload ships as a compressed assets tar.gz, extracted+validated (sha256)
# into filesDir/runtime on first run.
# ============================================================================
android_host:
  app_module: app/
  application_id: ai.opencode.android
  min_sdk: 29            # W^X: exec only from nativeLibraryDir; ABI gate enforces 64-bit
  target_sdk: 34
  compile_sdk: 34
  kotlin: 1.9.24
  agp: 8.5.2
  gradle: 8.9
  compose_bom: 2024.06.00
  payload_version: 5     # bumped on payload/layout change; drives re-extraction (5 = Phase 5)
  # per-ABI JNI executables (Android extracts to nativeLibraryDir, exec-allowed):
  jni_libs:
    - { name: libbun.so,  source: "@oven/bun-linux-{x64|aarch64}-android@1.3.14", bionic: true }
    - { name: libgit.so,  source: "Git v2.48.1 from source (NO_PERL=YesPlease, Android NDK/Bionic, NO_CURL/OPENSSL/EXPAT)" }
    - { name: librg.so,   source: "ripgrep 15.1.0 from source (x86_64/aarch64 Android targets, Cargo + NDK/Bionic, pcre2 feature)" }
  # compressed JS payload (assets/, extracted flat into filesDir with sha256 verification; runtime/ holds host metadata):
  payload_assets:
    - runtime-payload.tar.gz   # opencode/dist/node/node.js bundle + *.wasm + node_modules + launcher.js
    - runtime-manifest.json    # versions + per-file sha256/size + payload tarball sha256
  data_layout:
    files_dir: "/data/data/<pkg>/files"
    runtime:   "files/runtime/opencode/dist/node/node.js (from assets, validated)"
    symlinks:  "files/bin/{bun,git,rg} -> /data/app/.../lib64/lib{ bun,git,rg }.so"
    xdg:       "files/xdg/{data,config,state,cache,tmp} (HOME=files/home)"
    workspaces: "files/workspaces/<project>"
    logs:      "files/log/runtime.log + files/log/crashes/ + xdg/state/opencode/log/"
    secrets:   "files/secrets/<name>.enc — AES-256-GCM blobs under a non-exportable AndroidKeyStore key (Phase 5); the pre-Phase-5 plaintext server-password file is migrated and deleted"
  abi_support:
    shipping: [arm64-v8a]
    emulator_ci: [x86_64]
    rejected_with_message: [armeabi-v7a, x86]   # AbiGate -> UNSUPPORTED_DEVICE state
  lifecycle:
    foreground_service: "RuntimeService (type specialUse) — keeps the agent + shell/git/MCP child processes alive across background/doze"
    health: "poll GET /global/health with Basic auth (not 'process launched')"
    restart: "crash -> bounded exponential backoff (1s..30s, max 8 attempts) then FATAL"
    stop: "SIGTERM (graceful) -> SIGKILL -> /proc sweep (no zombies/duplicates)"
    duplicate_prevention: "single RuntimeService + pidfile + /proc launcher.js sweep + single port bind"
