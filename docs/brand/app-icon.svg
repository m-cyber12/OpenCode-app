<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenCode app icon - master artwork (vector).
  Coordinates are on a 1568 x 1568 grid. Renders at any size.
  Android foreground/background are derived from this file in
  app/src/main/res/drawable/ic_launcher_foreground.xml and values/ic_launcher_background.xml.
  Store icon (512 px PNG) is docs/store/icon-512.png, rendered from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1568 1568">
  <defs>
    <!-- Dark tile: lit from the top-left, darker toward the bottom-right -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#363636"/>
      <stop offset="0.45" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Tile rim: lighter at the top edge, dark at the bottom -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6a"/>
      <stop offset="0.5" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <!-- Brushed-steel plate -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f9"/>
      <stop offset="0.42" stop-color="#c3c6ca"/>
      <stop offset="0.72" stop-color="#e4e6e9"/>
      <stop offset="1" stop-color="#a7abb0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Raised "V" bar: grey metal with a bevel -->
    <linearGradient id="vbar" gradientUnits="userSpaceOnUse" x1="580" y1="560" x2="790" y2="930">
      <stop offset="0" stop-color="#a3a6ab"/>
      <stop offset="0.55" stop-color="#55585d"/>
      <stop offset="1" stop-color="#7a7d82"/>
    </linearGradient>

    <filter id="plateShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="16" stdDeviation="9" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="holeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="114" y="108" width="1340" height="1352" rx="290" ry="290" fill="url(#tile)"/>
  <rect x="114" y="108" width="1340" height="1352" rx="290" ry="290" fill="url(#tileLight)"/>
  <rect x="115" y="109" width="1338" height="1350" rx="289" ry="289" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Plate with three openings (evenodd: the openings are holes, the dark tile shows through) -->
  <g filter="url(#plateShadow)">
    <path fill="url(#steel)" fill-rule="evenodd" d="
      M498 350 H1070 V1218 H498 Z
      M657 493 H912 V1070 H657 Z
      M563 575 H600 V1065 H563 Z
      M968 575 H1003 V1065 H968 Z"/>
  </g>
  <!-- Light sheen over the plate -->
  <path fill="url(#sheen)" fill-rule="evenodd" d="
    M498 350 H1070 V1218 H498 Z
    M657 493 H912 V1070 H657 Z
    M563 575 H600 V1065 H563 Z
    M968 575 H1003 V1065 H968 Z"/>
  <!-- Bevel on the plate edge -->
  <rect x="500" y="352" width="568" height="864" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4"/>
  <rect x="498" y="350" width="572" height="868" fill="none" stroke="#5c5f63" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="0"/>
  <!-- Bevel on the opening edges (lit from the top-left, so the bottom and right edges catch the light) -->
  <g fill="none" stroke-width="5" stroke-linejoin="miter">
    <rect x="657" y="493" width="255" height="577" stroke="#4d5054"/>
    <path d="M563 1065 V575 H600 V1065" stroke="#4d5054"/>
    <path d="M968 1065 V575 H1003 V1065" stroke="#4d5054"/>
    <path d="M657 1070 H912" stroke="#f1f2f4" stroke-opacity="0.9"/>
    <path d="M600 1065 H563 M1003 1065 H968" stroke="#f1f2f4" stroke-opacity="0.6"/>
  </g>

  <!-- The raised V bar across the middle opening -->
  <g filter="url(#barShadow)">
    <polyline points="583,600 784,870 985,600" fill="none" stroke="url(#vbar)" stroke-width="56" stroke-linejoin="miter" stroke-linecap="butt"/>
  </g>
  <!-- Top-left bevel highlight on the V -->
  <polyline points="575,592 784,880 993,592" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" stroke-linejoin="miter"/>
</svg>
