<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="163" y1="115" x2="349" y2="397">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.4" stop-color="#cfcfcf"/>
      <stop offset="0.6" stop-color="#e9e9e9"/>
      <stop offset="1" stop-color="#9c9c9c"/>
    </linearGradient>
    <linearGradient id="vmetal" gradientUnits="userSpaceOnUse" x1="0" y1="187" x2="0" y2="287">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="0.5" stop-color="#6a6a6a"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <radialGradient id="holeBase" gradientUnits="userSpaceOnUse" cx="256" cy="275" r="150">
      <stop offset="0" stop-color="#303033"/>
      <stop offset="0.6" stop-color="#151516"/>
      <stop offset="1" stop-color="#060606"/>
    </radialGradient>
    <linearGradient id="holeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="holeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.6" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="256" cy="335" r="55"><stop offset="0" stop-color="#fff" stop-opacity="0.09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="vclip"><rect x="150" y="187" width="220" height="133"/></clipPath>
    <clipPath id="holeClip"><rect x="213" y="157" width="86" height="192"/></clipPath>
    <filter id="vshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- silver frame with cutouts (slots now reach the bottom of the centre hole, y=349) -->
  <path fill="url(#silver)" fill-rule="evenodd"
        d="M163 115H349V397H163Z
           M213 157H299V349H213Z
           M185 187H195V349H185Z
           M319 187H329V349H319Z"/>
  <rect x="163" y="115" width="186" height="282" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1"/>

  <!-- middle hole: lighting & shadow -->
  <rect x="213" y="157" width="86" height="192" fill="url(#holeBase)"/>
  <g clip-path="url(#holeClip)">
    <rect x="213" y="157" width="86" height="70" fill="url(#holeTop)"/>
    <rect x="213" y="157" width="26" height="192" fill="url(#holeSide)"/>
    <rect x="289" y="157" width="10" height="192" fill="#000" opacity="0.25"/>
    <rect x="213" y="260" width="86" height="89" fill="url(#glow)"/>
    <rect x="213" y="346" width="86" height="3" fill="#fff" opacity="0.2"/>
  </g>

  <!-- side slots -->
  <rect x="185" y="187" width="10" height="162" fill="url(#slot)"/>
  <rect x="319" y="187" width="10" height="162" fill="url(#slot)"/>
  <rect x="185" y="346" width="10" height="3" fill="#fff" opacity="0.2"/>
  <rect x="319" y="346" width="10" height="3" fill="#fff" opacity="0.2"/>

  <!-- V -->
  <g filter="url(#vshadow)">
    <g clip-path="url(#vclip)">
      <path d="M177.4 170 L257 277.3 L336.6 170" fill="none" stroke="url(#vmetal)"
            stroke-width="20" stroke-linejoin="miter" stroke-miterlimit="4"/>
      <path d="M177.4 170 L257 277.3 L336.6 170" fill="none" stroke="#fff" stroke-opacity="0.14"
            stroke-width="3" stroke-linejoin="miter" stroke-miterlimit="4"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
